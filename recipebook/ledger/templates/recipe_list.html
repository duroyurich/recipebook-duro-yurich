{% extends 'base.html' %}

{% block page_heading %} Recipe List {% endblock %}

{% block content %}
    <ul>
        {% for recipe in recipes.all %}
        <li>
            <a href="{{recipe.get_absolute_url}}"> {{recipe.name}} </a>
        </li>
        {% endfor %}
    </ul>
    <a href="{% url 'ledger:recipe-add' %}"> Add Recipe </a>
{% endblock %}
